<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Отправка ответа</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }

    .card {
      width: 100%;
      max-width: 460px;
      margin: 24px auto;
      padding: 28px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 12px 35px rgba(15, 23, 42, 0.1);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 26px;
    }

    p {
      color: #64748b;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 16px 0 6px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font: inherit;
    }

    input:focus {
      outline: 2px solid #93c5fd;
      border-color: #2563eb;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #status {
      min-height: 24px;
      margin-top: 16px;
      text-align: center;
    }

    .success {
      color: #15803d;
    }

    .error {
      color: #b91c1c;
    }

    .teacher-link {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #2563eb;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Отправить ответ</h1>
    <p>Введите свои данные, номер задания и ответ.</p>

    <form id="answerForm">
      <label for="firstName">Имя</label>
      <input
        id="firstName"
        name="firstName"
        autocomplete="given-name"
        maxlength="80"
        required
      >

      <label for="lastName">Фамилия</label>
      <input
        id="lastName"
        name="lastName"
        autocomplete="family-name"
        maxlength="80"
        required
      >

      <label for="className">Класс</label>
      <input
        id="className"
        name="className"
        placeholder="Например: 7А"
        maxlength="20"
        required
      >

      <label for="taskNumber">Номер задания</label>
      <input
        id="taskNumber"
        name="taskNumber"
        placeholder="Например: 1"
        maxlength="40"
        required
      >

      <label for="answer">Ответ</label>
      <input
        id="answer"
        name="answer"
        maxlength="1000"
        required
      >

      <button id="sendButton" type="submit">
        Отправить ответ
      </button>
    </form>

    <div id="status" role="status" aria-live="polite"></div>

    <a class="teacher-link" href="teacher.html">
      Панель учителя
    </a>
  </main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwKhlv5R_qVoBFco1LJiSMSeClpRvSvTBEgE_lBn0g5OFDJqY5T6U0guj7rOi4prYU/exec";

    const form = document.getElementById("answerForm");
    const button = document.getElementById("sendButton");
    const status = document.getElementById("status");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const data = {
        action: "submit",
        firstName: document.getElementById("firstName").value.trim(),
        lastName: document.getElementById("lastName").value.trim(),
        className: document.getElementById("className").value.trim(),
        taskNumber: document.getElementById("taskNumber").value.trim(),
        answer: document.getElementById("answer").value.trim()
      };

      if (
        !data.firstName ||
        !data.lastName ||
        !data.className ||
        !data.taskNumber ||
        !data.answer
      ) {
        status.className = "error";
        status.textContent = "Заполните все поля.";
        return;
      }

      button.disabled = true;
      status.className = "";
      status.textContent = "Отправляем ответ…";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify(data)
        });

        if (!response.ok) {
          throw new Error("Сервер недоступен.");
        }

        const result = await response.json();

        if (!result.ok) {
          throw new Error(result.error || "Не удалось отправить ответ.");
        }

        status.className = "success";
        status.textContent = result.message || "Ответ отправлен!";
        document.getElementById("answer").value = "";
      } catch (error) {
        status.className = "error";
        status.textContent =
          error.message +
          " Если отправка прервалась, уточните у учителя, получен ли ответ.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
